<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Steam Price Watcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="title-row">
        <h1 id="appTitle">مراقب أسعار Steam</h1>
        <select id="langSelect" class="lang-select">
          <option value="ar">AR</option>
          <option value="en">EN</option>
        </select>
      </div>
      <div class="status-row">
        <span id="statusText" class="status-text">...</span>
        <button id="refreshBtn" class="icon-btn" title="فحص الآن">⟳</button>
      </div>
    </header>

    <section class="add-game">
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="ابحث عن اسم اللعبة..." />
        <button id="searchBtn">بحث</button>
      </div>
      <div id="searchResults" class="search-results hidden"></div>

      <div id="addForm" class="add-form hidden">
        <div class="selected-game">
          <img id="selectedImg" src="" alt="" />
          <span id="selectedName"></span>
        </div>
        <div class="target-row">
          <label id="targetPriceLabelText" for="targetPriceInput">نبّهني إذا نزل السعر إلى:</label>
          <input id="targetPriceInput" type="number" step="0.01" min="0" placeholder="مثال: 10.00" />
          <button id="confirmAddBtn">إضافة</button>
          <button id="cancelAddBtn" class="secondary">إلغاء</button>
        </div>
      </div>
    </section>

    <section class="settings">
      <label id="intervalLabelText" for="intervalSelect">فحص كل:</label>
      <select id="intervalSelect">
        <option value="1">ساعة واحدة</option>
        <option value="3">3 ساعات</option>
        <option value="6">6 ساعات</option>
        <option value="12">12 ساعة</option>
        <option value="24">يوم كامل (24 ساعة)</option>
      </select>
    </section>

    <section class="games-list">
      <ul id="gamesList"></ul>
      <p id="emptyState" class="empty-state hidden">لا توجد ألعاب مضافة بعد. ابحث وأضف أول لعبة!</p>
    </section>
  </div>

  <script src="translations.js"></script>
  <script src="popup.js"></script>
</body>
</html>

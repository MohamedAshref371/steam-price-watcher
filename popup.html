<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Steam Price Watcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="title-row">
        <h1 id="appTitle">مراقب أسعار Steam</h1>
        <a href="https://github.com/MohamedAshref371/steam-price-watcher" target="_blank" rel="noopener" class="github-link" title="GitHub">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
        <div class="lang-group">
          <span class="lang-icon">🌐</span>
          <select id="langSelect" class="lang-select">
            <option value="ar">العربية</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>
      <div class="status-row">
        <span id="statusText" class="status-text">...</span>
        <button id="refreshBtn" class="icon-btn" title="افحص الآن">⟳</button>
      </div>
    </header>

    <section class="add-game">
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="ابحث عن اسم اللعبة..." />
        <button id="searchBtn">بحث</button>
      </div>
      <div id="searchResults" class="search-results hidden"></div>

      <div id="addForm" class="add-form hidden">
        <div class="selected-game">
          <img id="selectedImg" src="" alt="" />
          <span id="selectedName"></span>
        </div>
        <div class="current-price-row">
          <span id="currentPriceLabelText">السعر الحالي:</span>
          <span id="currentPriceValue">...</span>
        </div>
        <div class="alert-type-row">
          <span id="alertTypeLabelText" class="alert-type-label">نبّهني:</span>
          <label class="radio-option">
            <input type="radio" name="alertType" value="target" checked />
            <span id="alertTypeTargetText">إذا نزل السعر إلى</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="alertType" value="sale" />
            <span id="alertTypeSaleText">إذا كان عليها أي خصم</span>
          </label>
        </div>
        <div class="target-row">
          <input id="targetPriceInput" type="number" step="0.01" min="0" lang="en" placeholder="مثال: 10.00" />
          <button id="confirmAddBtn">إضافة</button>
          <button id="cancelAddBtn" class="secondary">إلغاء</button>
        </div>
        <p id="duplicateWarningText" class="duplicate-warning hidden">هذه اللعبة مضافة بالفعل</p>
      </div>
    </section>

    <section class="settings">
      <div class="region-row">
        <label id="regionLabelText" for="regionSelect">المنطقة/الدولة:</label>
        <select id="regionSelect">
          <option value="us">🇺🇸 United States</option>
          <option value="eg">🇪🇬 مصر</option>
          <option value="sa">🇸🇦 السعودية</option>
          <option value="ae">🇦🇪 الإمارات</option>
          <option value="kw">🇰🇼 الكويت</option>
          <option value="qa">🇶🇦 قطر</option>
          <option value="jo">🇯🇴 الأردن</option>
          <option value="tr">🇹🇷 Türkiye</option>
          <option value="gb">🇬🇧 United Kingdom</option>
          <option value="de">🇩🇪 Deutschland</option>
          <option value="in">🇮🇳 भारत</option>
          <option value="br">🇧🇷 Brasil</option>
          <option value="ru">🇷🇺 Россия</option>
          <option value="__custom__">…</option>
        </select>
        <input type="text" id="regionCustomInput" class="hidden" maxlength="2" placeholder="كود آخر (مثال: jp)" />
      </div>
      <label id="intervalLabelText" for="intervalSelect">الفحص كل:</label>
      <select id="intervalSelect">
        <option value="1">ساعة واحدة</option>
        <option value="3">3 ساعات</option>
        <option value="6">6 ساعات</option>
        <option value="12">12 ساعة</option>
        <option value="24">يوم كامل (24 ساعة)</option>
      </select>
      <div class="repeat-alerts-row">
        <input type="checkbox" id="repeatAlertsCheckbox" />
        <label id="repeatAlertsLabelText" for="repeatAlertsCheckbox">نبّهني في كل فحص طالما السعر أقل من الهدف</label>
      </div>
      <div class="sort-row">
        <label id="sortLabelText" for="sortSelect">ترتيب حسب:</label>
        <select id="sortSelect">
          <option value="default">الافتراضي (وقت الإضافة)</option>
          <option value="cheapest">الأرخص أولاً</option>
          <option value="closest">الأقرب للهدف</option>
          <option value="discount">عليها خصم الآن</option>
        </select>
      </div>
    </section>

    <section class="games-list">
      <ul id="gamesList"></ul>
      <p id="emptyState" class="empty-state hidden">لا توجد ألعاب مضافة بعد. ابحث وأضف أول لعبة!</p>
    </section>
  </div>

  <script src="translations.js"></script>
  <script src="popup.js"></script>
</body>
</html>
